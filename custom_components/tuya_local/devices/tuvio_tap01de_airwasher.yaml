name: Air washer
products:
  - id: cdtata05klpwbyu9
    manufacturer: Tuvio
    model: TAP01DE
entities:
  - entity: humidifier
    class: humidifier
    translation_only_key: extended
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 13
        type: integer
        name: humidity
        optional: true
        unit: "%"
        range:
          min: 40
          max: 70
        mapping:
          - step: 1
            constraint: mode
            conditions:
              # Target humidity only applies when humidity-control mode is on
              - dps_val: true
                invalid: false
              - dps_val: false
                invalid: true
      - id: 14
        type: integer
        name: current_humidity
        unit: "%"
      - id: 108
        type: boolean
        name: mode
        mapping:
          - dps_val: true
            value: auto
          - dps_val: false
            value: continuous

  - entity: fan
    translation_only_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 101
        type: string
        name: preset_mode
        mapping:
          - dps_val: "A"
            value: auto
          - dps_val: "1"
            value: low
          - dps_val: "2"
            value: medium
          - dps_val: "3"
            value: high
          - dps_val: "4"
            value: strong

  - entity: switch
    translation_key: humidify
    dps:
      - id: 104
        type: boolean
        name: switch

  - entity: switch
    translation_key: drying
    dps:
      - id: 105
        type: boolean
        name: switch

  - entity: switch
    translation_key: night_mode
    dps:
      - id: 16
        type: boolean
        name: switch

  - entity: switch
    translation_key: vertical_swing
    dps:
      - id: 102
        type: boolean
        name: switch

  - entity: switch
    translation_key: uv_sterilization
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch

  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 109
        type: boolean
        name: switch

  - entity: light
    translation_key: nightlight
    category: config
    dps:
      - id: 5
        type: boolean
        name: switch
      - id: 106
        type: integer
        name: brightness
        unit: "%"
        range:
          min: 1
          max: 100

  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1H"
            value: "1h"
          - dps_val: "2H"
            value: "2h"
          - dps_val: "3H"
            value: "3h"
          - dps_val: "4H"
            value: "4h"
          - dps_val: "5H"
            value: "5h"
          - dps_val: "6H"
            value: "6h"
          - dps_val: "7H"
            value: "7h"
          - dps_val: "8H"
            value: "8h"
          - dps_val: "9H"
            value: "9h"

  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: h

  - entity: binary_sensor
    translation_key: tank_empty
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - value: false
      - id: 22
        type: bitfield
        name: fault_code

  - entity: sensor
    translation_key: filter_life
    class: duration
    category: diagnostic
    dps:
      - id: 33
        type: integer
        name: sensor
        unit: h
